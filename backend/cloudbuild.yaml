# Builds the backend image for Cloud Run. See docs/adr/ADR-002-deployment.md.
#
# Cloud Build rather than a local `docker build`, for three reasons that are
# consequences of the development machine rather than preferences. Cloud Run
# runs linux/amd64 only -- "Cloud Run specifically supports the Linux x86_64
# ABI format" -- and this project is developed on arm64, so a local build
# would need cross-compilation. Docker is not installed here at all. And the
# corpus ingest needs the provider key at build time, which Secret Manager
# supplies without the key reaching a shell history or an image layer.
#
# `$PROJECT_ID` is written inline rather than folded into a `substitutions:`
# default, because Cloud Build does not expand built-in substitutions inside
# user substitution defaults -- measured: it rejected the build with
# `could not parse reference: .../${PROJECT_ID}/...`.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/upgradepilot/backend"
        # The key reaches the build as a BuildKit secret mount, never as a
        # --build-arg: a build arg is recorded in image history, which is a
        # published artefact. printf, not echo, so no newline is appended.
        printf '%s' "$$LLM_API_KEY" > /workspace/llm_api_key
        trap 'rm -f /workspace/llm_api_key' EXIT
        DOCKER_BUILDKIT=1 docker build \
          --secret id=llm_api_key,src=/workspace/llm_api_key \
          --tag "$${IMAGE}:$SHORT_SHA" \
          --tag "$${IMAGE}:latest" \
          .
    # `availableSecrets` alone is not enough: each step must declare which
    # secrets it consumes. Without this, Cloud Build rejects the build with
    # `secretEnv "LLM_API_KEY" is defined without being used` -- it cannot see
    # the `$$LLM_API_KEY` above, because `$$` escapes the substitution so that
    # bash receives it rather than Cloud Build resolving it.
    secretEnv:
      - LLM_API_KEY

  - id: verify-no-key-in-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/upgradepilot/backend"
        # A secret mount is not supposed to survive into the image. Asserted
        # rather than trusted: the failure is silent and the artefact is about
        # to be pushed to a registry.
        if docker history --no-trunc "$${IMAGE}:$SHORT_SHA" | grep -q 'sk-or-'; then
          echo "FAILED: a provider key appears in the image history"
          exit 1
        fi
        echo "image history carries no provider key"

  - id: verify-corpus-is-populated
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/upgradepilot/backend"
        # ADR-002 D3's whole point. /api/health reports "ok" over an empty
        # collection, so counting is the only way to know the corpus was
        # baked in. A build that ships an empty knowledge base must fail here
        # rather than deploy a product that cites nothing.
        #
        # chromadb directly rather than through KnowledgeStore, which requires
        # an embedding function it does not need to count -- and building one
        # would need the provider key, which this stage deliberately lacks.
        # COLLECTION_NAME is imported rather than written out, so a rename
        # cannot leave this counting a collection that no longer exists.
        docker run --rm --entrypoint python "$${IMAGE}:$SHORT_SHA" -c "
        import chromadb
        from upgradepilot.config import get_settings
        from upgradepilot.services.knowledge.store import COLLECTION_NAME
        path = str(get_settings().chroma_dir)
        count = chromadb.PersistentClient(path=path).get_collection(COLLECTION_NAME).count()
        print(f'corpus chunks in image: {count}')
        assert count > 0, 'the baked Chroma collection is empty'
        "

  - id: verify-it-actually-serves
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/upgradepilot/backend"
        # The steps above prove the image was assembled correctly. None of
        # them proves it runs. This is the only check here that exercises the
        # CMD -- uvicorn's `--factory`, the port binding Cloud Run injects,
        # and listening on 0.0.0.0 rather than localhost -- and each is a
        # single-token mistake that a Cloud Run deploy would surface as an
        # opaque startup timeout.
        #
        # No key is supplied, deliberately: `/api/health` must answer anyway.
        # `open_runtime` keeps a startup failure on the runtime object rather
        # than raising into uvicorn's boot, so the correct response here is
        # 200 with `degraded`, and a process that instead fails to boot is a
        # regression in that behaviour.
        CID=$$(docker run -d -e PORT=8080 "$${IMAGE}:$SHORT_SHA")
        trap 'docker logs "$$CID" 2>&1 | tail -25; docker rm -f "$$CID" >/dev/null' EXIT

        READY=""
        for _ in $$(seq 1 40); do
          if docker exec "$$CID" python -c "
        import sys, urllib.request
        try:
            urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)
        except Exception:
            sys.exit(1)
        " 2>/dev/null; then READY=yes; break; fi
          sleep 1
        done
        if [ -z "$$READY" ]; then echo "FAILED: the container never served /api/health"; exit 1; fi

        docker exec "$$CID" python -c "
        import json, urllib.request
        body = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5))
        print('health:', json.dumps(body, sort_keys=True))
        # The baked corpus must be where the runtime stage says it is.
        assert body['checks']['chroma_dir'] is True, 'the baked corpus is not readable at runtime'
        # No UP_CHECKPOINT_URL in the image, so SQLite is the backend and the
        # response must say so -- this also exercises ADR-002's new field.
        assert body['checkpoint_backend'] == 'sqlite', body['checkpoint_backend']
        # No key was supplied, so this must be the honest answer rather than 'ok'.
        assert body['status'] == 'degraded', body['status']
        assert body['checks']['llm_configured'] is False
        print('the image starts, binds the configured port, and reports its own state honestly')
        "

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/upgradepilot/backend:$SHORT_SHA
  - europe-west1-docker.pkg.dev/$PROJECT_ID/upgradepilot/backend:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/llm-api-key/versions/latest
      env: LLM_API_KEY

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

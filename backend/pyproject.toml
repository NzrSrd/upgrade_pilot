[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upgradepilot"
version = "0.1.0"
description = "Dependency upgrade risk and migration planning"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "openai==3.3.1",
    "chromadb==1.5.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `norecursedirs` REPLACES pytest's built-in default wholesale rather than
# extending it -- setting this key without spelling out the defaults would
# silently re-enable recursion into `.venv`, `node_modules`, etc. (verified:
# an explicit `pytest .` from `backend/` then collects out of `.venv`, since
# `testpaths` is ignored once a path argument is given). The first nine
# entries are pytest's own defaults, copied verbatim; only the last entry is
# new.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "tests/fixtures/sample_repo",
]
asyncio_mode = "auto"
markers = [
    "live: makes a real network call; skipped unless --live is passed",
]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/sample_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# `WorkspaceManager.open` is the only caller that enforces the repository
# size caps; `clone_repository` and `open_local_repository` do not, so a
# direct import of either yields an uncapped Workspace. Nothing in the code
# prevents that import, so the lint run does. This is honest about its
# reach: it catches the accidental in-repo import, and nothing outside this
# repository's lint run. The security guards do not depend on it -- the URL
# allowlist and `allowed_local_roots` are enforced inside those two
# functions, so a bypass loses the caps, never the allowlists.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"upgradepilot.services.repo.clone.clone_repository".msg = "Import WorkspaceManager instead: clone_repository does not enforce the repository size caps."
"upgradepilot.services.repo.local.open_local_repository".msg = "Import WorkspaceManager instead: open_local_repository does not enforce the repository size caps."

[tool.ruff.lint.per-file-ignores]
# The manager is the intended caller, and these test modules exercise the
# two functions directly on purpose -- including the door-parity test that
# must call both doors itself.
"src/upgradepilot/services/repo/manager.py" = ["TID251"]
"tests/unit/test_clone.py" = ["TID251"]
"tests/unit/test_workspace.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/upgradepilot/models", "src/upgradepilot/services"]

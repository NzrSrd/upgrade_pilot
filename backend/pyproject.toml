[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upgradepilot"
version = "0.1.0"
description = "Dependency upgrade risk and migration planning"
# 3.14, not 3.12 and not 3.13. `Workspace.iter_files` relies on
# `Path.rglob` defaulting to `recurse_symlinks=False`, which arrived in
# 3.13: on 3.12 an ancestor-pointing symlink in a user-supplied repository
# makes that generator non-terminating, and `enforce_caps` cannot stop it
# because caps are checked per yielded file. 3.13 would only trade a false
# claim for an untested one -- 3.14.5 is the only interpreter this code has
# ever run on. Reason recorded in ADR-001's Phase 0 verification record.
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "openai==3.3.1",
    "chromadb==1.5.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "tiktoken==0.14.0",
    # CLAUDE.md rule 12 -- the stated reason. Phase 3's corpus is authored as
    # Markdown with YAML frontmatter (spec §7.2), and the standard library has
    # no YAML parser. The alternative was a hand-rolled one, rejected: the
    # frontmatter this project actually writes needs quoted scalars whose
    # values contain `:` (`title: "@validator replaced by @field_validator"`),
    # flow sequences (`affected_symbols: [validator, root_validator]`) and
    # dates, which is a real parser, and a parser that mis-reads a corpus
    # document mis-attributes a citation.
    #
    # Already resolved in the environment as a transitive of chromadb and
    # langchain-core, so this pin adds no install. It is declared anyway
    # because `corpus.py` imports it directly, and depending on someone
    # else's transitive is exactly the kind of unstated assumption that
    # breaks on an unrelated upgrade.
    #
    # `yaml.safe_load` only -- never `load`. Corpus documents are checked in
    # rather than user-supplied, so this is defence in depth, not a boundary.
    # The implicit-typing hazard that ships with YAML is handled where it
    # matters instead: `CorpusDocument` refuses an unquoted `to_version: 2.0`
    # rather than coercing the float back to a string nobody wrote.
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    # PyYAML ships no inline types and no `py.typed`, so `import yaml` is an
    # `import-untyped` error under strict mypy. Stubs only -- no runtime
    # effect, which is why it is a dev dependency rather than a runtime one.
    "types-PyYAML==6.0.12.20260815",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `py.typed` is the PEP 561 marker: without it listed here, `setuptools`
# does not include the file in the built wheel even though it sits inside
# the package directory, and consumers of an installed `upgradepilot` would
# see mypy's `import-untyped` for every import despite the package being
# fully strict-typed.
upgradepilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `norecursedirs` REPLACES pytest's built-in default wholesale rather than
# extending it -- setting this key without spelling out the defaults would
# silently re-enable recursion into `.venv`, `node_modules`, etc. (verified:
# an explicit `pytest .` from `backend/` then collects out of `.venv`, since
# `testpaths` is ignored once a path argument is given). The first nine
# entries are pytest's own defaults, copied verbatim; only the last entry is
# new.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "tests/fixtures/sample_repo",
]
asyncio_mode = "auto"
markers = [
    "live: makes a real network call; skipped unless --live is passed",
]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/sample_repo"]
# `extend-exclude` alone is not enough: it is ignored when a path is named
# explicitly on the command line, which is exactly how a pre-commit hook and
# an editor's format-on-save invoke ruff. Verified before this line existed:
# `ruff format --diff tests/fixtures/sample_repo/src/app/models.py`
# reformatted the fixture, and `ruff check` on the same path raised UP045,
# whose fix rewrites `Optional[str]` to `str | None` -- destroying the
# Pydantic v1 idiom that fixture exists to provide.
force-exclude = true

# Deliberately one release below `requires-python`. This is a FORMATTING and
# lint-modernisation target, not a compatibility claim -- the runtime floor is
# 3.14 and stated once, above. Ruff infers its target from `requires-python`,
# and at py314 the formatter applies PEP 758, rewriting
# `except (OSError, RuntimeError):` into `except OSError, RuntimeError:` at
# three sites in the repository guards. That form is valid 3.14 syntax and
# semantically identical, but it is visually indistinguishable from Python 2's
# `except E, name:` -- which BOUND the exception to the second name rather than
# catching it. In the security boundary, where which exception types are caught
# is the whole point of the clause, a form that misreads as variable binding is
# a cost we decline to pay for a style change that buys nothing.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# `WorkspaceManager.open` is the only caller that enforces the repository
# size caps; `clone_repository` and `open_local_repository` do not, so a
# direct import of either yields an uncapped Workspace. Nothing in the code
# prevents that import, so the lint run does. This is honest about its
# reach: it catches the accidental in-repo import, and nothing outside this
# repository's lint run. The security guards do not depend on it -- the URL
# allowlist and `allowed_local_roots` are enforced inside those two
# functions, so a bypass loses the caps, never the allowlists.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"upgradepilot.services.repo.clone.clone_repository".msg = "Import WorkspaceManager instead: clone_repository does not enforce the repository size caps."
"upgradepilot.services.repo.local.open_local_repository".msg = "Import WorkspaceManager instead: open_local_repository does not enforce the repository size caps."

[tool.ruff.lint.per-file-ignores]
# The manager is the intended caller, and these test modules exercise the
# two functions directly on purpose -- including the door-parity test that
# must call both doors itself.
"src/upgradepilot/services/repo/manager.py" = ["TID251"]
"tests/unit/test_clone.py" = ["TID251"]
"tests/unit/test_workspace.py" = ["TID251"]
# The live https clone test calls the clone door directly for the same
# reason `test_clone.py` does: it is testing that door's transport, so
# routing through `WorkspaceManager` would test something else. Uncapped is
# correct here -- the repository it clones is a fixed, known-small public
# remote named in the module, not caller-supplied input.
"tests/repo/test_clone_live.py" = ["TID251"]

[tool.mypy]
# Without this, mypy relies solely on `BaseModel`'s PEP 681
# `@dataclass_transform` and synthesises `Settings.__init__` from its
# declared fields alone -- which does not know about `BaseSettings`'s own
# private construction kwargs (`_env_file`, `_secrets_dir`, ...) that
# `pydantic_settings/main.py` documents as real, typed `__init__` parameters
# at runtime. Every test in `test_settings.py` constructs `Settings(_env_file=None)`
# to keep `.env` out of the test process, and without the plugin each such
# call is a false `call-arg` error (verified: 46 of them, all resolved by
# adding this one line -- not by 46 per-call `# type: ignore`s).
plugins = ["pydantic.mypy"]
# Must match `requires-python` above. The pin is not cosmetic: at
# `--python-version 3.12` mypy *rejects* `rglob(..., recurse_symlinks=False)`
# as an unexpected keyword argument and accepts it at 3.14, so a stale pin
# type-checks this code against a stdlib it does not run on.
python_version = "3.14"
strict = true
# The whole package, not just `models/` and `services/`. The narrow scope
# left `__init__.py`, `config.py` and all four files under `api/` unchecked
# -- `config.py` being the one everything imports -- so `strict = true` was
# doing less than it appeared to. Widening cost nothing: the six previously
# excluded files pass strict as they stand. `tests` is now included too --
# see the `exclude` note directly below for the one carve-out.
files = ["src/upgradepilot", "tests"]
# The fixture tree is deliberately Pydantic-v1 (`Optional[str]` with no
# default, `class Config:`, `@validator`) and contains a deliberately
# unparseable file. Its 13 strict errors are the POINT of the fixture, and
# "fixing" them turns tests/unit/test_fixture_repo.py red.
#
# Known limitation, verified rather than assumed: this `exclude` is bypassed
# when a path is named explicitly on the command line -- exactly like
# ruff's `extend-exclude` before `force-exclude` was added -- and mypy has
# NO `force-exclude` equivalent to close it.
#   mypy --exclude 'tests/fixtures/sample_repo' tests/fixtures/sample_repo/src/app/util.py
#     -> Found 3 errors in 1 file (checked 1 source file)     # excluded, still checked
#   mypy --exclude 'tests/fixtures/sample_repo' tests/fixtures
#     -> Success: no issues found in 2 source files           # crawl respects it
# So a bare `mypy` (the CI invocation and this project's gate) is protected;
# an editor's check-this-file action or a pre-commit hook passing changed
# filenames is not.
exclude = ["^tests/fixtures/sample_repo/"]

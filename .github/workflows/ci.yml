# Phase 11's CI item, and Phase 13's stated prerequisite.
#
# Three jobs rather than one, because they fail for different reasons and a
# reader should not have to read a log to find out which: `backend` and
# `frontend` each own their toolchain, and `contract` owns the one check that
# needs both.
#
# Every command here is the command the README documents, invoked with no extra
# flags -- ruff, mypy and pytest all read their configuration from
# `backend/pyproject.toml`. A flag added here that is not in the README would
# mean CI checks something no developer runs locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.14 is a hard floor, not a preference. ADR-001: "Do not relax this."
      # `Workspace.iter_files` relies on `Path.rglob` defaulting to
      # `recurse_symlinks=False`, which arrived in 3.13; below it, a symlink
      # pointing at its own ancestor makes that generator non-terminating, and
      # the size caps cannot stop it because they are checked per yielded file.
      # That is a hang reachable from user-supplied repository content.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      # Lint before tests: a lint failure is cheaper to read than a test log,
      # and the banned-api rules here are a security guard rather than style --
      # they stop an import of the two repository doors that do not enforce the
      # size caps.
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy

      # The default suite is hermetic: no network, no LLM, no API key. The
      # `live` tests are excluded by `tests/conftest.py` unless `--live` is
      # passed, and CI deliberately does not pass it -- those five tests need a
      # real key and make real model calls. Rule 24 keeps them in the suite; it
      # does not ask CI to pay for them on every push.
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Pinned to the major this project has actually been run against
      # (v24.13.1, recorded in the README). There is no `.nvmrc`, so this
      # workflow is currently the only place a Node version is asserted.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `vitest run`, not `npm test`. The `test` script is bare `vitest`, which
      # is watch mode -- in CI that either hangs or exits having watched
      # nothing. This is the single most likely way for this file to be wrong.
      - run: npx vitest run

      # `npm run build` is `tsc -b && vite build`, so it covers the typecheck.
      # `tsc -b` is still run first and separately: when a type error and a
      # build error arrive together, two red steps say which came first.
      - run: npx tsc -b
      - run: npm run build

  # The generated API contract, which is the one thing neither job above can
  # check alone: the schema is produced by the backend and consumed by the
  # frontend, and drift between them is silent. `openapi.json` and
  # `schema.d.ts` are committed, so regenerating both must be a no-op.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: python -m pip install -e '.[dev]'
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      - run: python scripts/dump_openapi.py
        working-directory: backend

      - run: npm run gen:api
        working-directory: frontend

      # Scoped to the two generated files. An unrelated dirty file is not this
      # job's business, and failing on one would make the check untrustworthy
      # for the thing it does watch.
      - name: The committed API contract is up to date
        run: |
          git diff --exit-code -- \
            frontend/src/api/openapi.json \
            frontend/src/api/schema.d.ts \
          || {
            echo "::error::openapi.json or schema.d.ts is stale."
            echo "Run: backend/.venv/bin/python backend/scripts/dump_openapi.py"
            echo "then: (cd frontend && npm run gen:api)"
            echo "and commit the result."
            exit 1
          }
